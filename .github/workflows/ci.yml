name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Un push nuevo cancela la ejecución anterior, salvo en main: un despliegue a producción no se corta a medias.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Versión exacta de la CLI para despliegues reproducibles; actualizarla a propósito.
  VERCEL_CLI_VERSION: 63.1.2


jobs:
  quality:
    name: Lint · Typecheck · Unit · Build
    runs-on: ubuntu-latest
    # El build de este job es el artefacto productivo: sin mocks ni bypass de sesión
    # (lib/env-guard.ts rompe el build si se activan con NODE_ENV=production).
    env:
      NEXT_PUBLIC_USE_MOCKS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    env:
      # Modo de pruebas explícito: los E2E corren sobre next dev, no sobre el build productivo.
      NEXT_PUBLIC_USE_MOCKS: "true"
      E2E_MOCK_AUTH: "true"
      OMNIMARKET_TEST_ENV: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  cypress:
    name: E2E (Cypress)
    needs: quality
    runs-on: ubuntu-latest
    env:
      # Modo de pruebas explícito: los E2E corren sobre next dev, no sobre el build productivo.
      NEXT_PUBLIC_USE_MOCKS: "true"
      E2E_MOCK_AUTH: "true"
      OMNIMARKET_TEST_ENV: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:cypress
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          retention-days: 7

  published-api:
    name: E2E (API publicado)
    needs: quality
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_USE_MOCKS: "false"
      OMNIMARKET_API_URL: https://omni-market-back.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e:published-api
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: published-api-playwright-report
          path: test-results/
          retention-days: 7

  ci-gate:
    name: Frontend CI Gate
    if: always()
    needs: [quality, e2e, cypress, published-api]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every check to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          CYPRESS_RESULT: ${{ needs.cypress.result }}
          PUBLISHED_API_RESULT: ${{ needs.published-api.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ] || [ "$E2E_RESULT" != "success" ] || [ "$CYPRESS_RESULT" != "success" ] || [ "$PUBLISHED_API_RESULT" != "success" ]; then
            echo "One or more required frontend checks did not pass."
            exit 1
          fi

  # Producción solo se despliega desde la CI después de que Frontend CI Gate confirme todos los checks.
  # vercel.json desactiva el despliegue automático de main desde Git para que no exista una ruta paralela.
  deploy:
    name: Deploy a Vercel (producción)
    needs: [ci-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: front-vercel-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validar secretos de Vercel
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto ${name}. Configúralo en Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit "$missing"
      - name: Instalar Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"
      - name: Descargar configuración y variables de producción
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      # Usa las variables de producción del proyecto (OMNIMARKET_API_URL, NEXT_PUBLIC_USE_MOCKS=false…);
      # lib/env-guard.ts rompe el build si llegan mocks o bypass de sesión.
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Desplegar el build
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Desplegado ${url}" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke test (URL pública)
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Dominio público estable (variable del repositorio). La URL del deployment es solo el respaldo:
      # Deployment Protection de Vercel puede responder 401 en ella.
      PUBLIC_URL: ${{ vars.PRODUCTION_URL || needs.deploy.outputs.url }}
    steps:
      # next.config.ts reenvía /api/test/* al backend: son las rutas del lineamiento sobre el dominio público.
      - name: Endpoints de auditoría responden 200
        run: |
          base="${PUBLIC_URL%/}"
          case "$base" in http*) ;; *) base="https://${base}" ;; esac
          failed=0
          for path in "/api/test/analytics?page=1&limit=50" "/api/test/kanban-status?orderNumber=OM-TEST-1001"; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 --retry-all-errors --max-time 20 "${base}${path}" || true)"
            echo "${path} -> ${status}"
            [ "$status" = "200" ] || failed=1
          done
          exit "$failed"
