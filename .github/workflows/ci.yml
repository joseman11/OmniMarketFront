name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Unit · Build
    runs-on: ubuntu-latest
    # El build de este job es el artefacto productivo: sin mocks ni bypass de sesión
    # (lib/env-guard.ts rompe el build si se activan con NODE_ENV=production).
    env:
      NEXT_PUBLIC_USE_MOCKS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    env:
      # Modo de pruebas explícito: los E2E corren sobre next dev, no sobre el build productivo.
      NEXT_PUBLIC_USE_MOCKS: "true"
      E2E_MOCK_AUTH: "true"
      OMNIMARKET_TEST_ENV: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  cypress:
    name: E2E (Cypress)
    needs: quality
    runs-on: ubuntu-latest
    env:
      # Modo de pruebas explícito: los E2E corren sobre next dev, no sobre el build productivo.
      NEXT_PUBLIC_USE_MOCKS: "true"
      E2E_MOCK_AUTH: "true"
      OMNIMARKET_TEST_ENV: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:cypress
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          retention-days: 7
